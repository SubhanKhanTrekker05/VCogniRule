# === Database ===
spring.datasource.url=jdbc:sqlite:database/vcognirule.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1

# === Schema + data initialization ===
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# === Thymeleaf ===
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# === Web server ===
server.port=${PORT:8080}
# Never show stack traces or internal error messages to users (they still appear in the console log)
server.error.include-stacktrace=never
server.error.include-message=never

# === Logging ===
logging.level.com.ooad.mhs=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core=DEBUG

# === Desktop launcher ===
# true = open the home page in the default browser when the app is ready.
# Only VCogniRule.exe turns this on; Maven, the IDE and Railway leave it off.
vcognirule.open-browser=false

# === Demo switch: Decorator pattern ===
# true = log every condition check (TracingOperatorStrategy). Results do not change.
vcognirule.trace-operators=false
