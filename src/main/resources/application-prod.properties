# ============================================================
# VCogniRule - Production Profile
# ============================================================
# Activated by setting SPRING_PROFILES_ACTIVE=prod on Railway/Render.
# Overrides the dev-friendly settings in application.properties
# with production-safe values.
# ============================================================

# Hide stack traces from end users (prevents info leakage)
server.error.include-stacktrace=never
server.error.include-message=on_param

# Less verbose logging (saves log quota, no SQL in logs)
logging.level.com.ooad.mhs=INFO
logging.level.org.springframework.jdbc.core=WARN

# Enable Thymeleaf caching (faster page loads in production)
spring.thymeleaf.cache=true