<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCogniRule</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="welcome-page">
        <a href="/admin" class="admin-link"><img src="/admin-lock.svg" alt="Admin login" class="admin-icon" /></a>

        <div class="welcome-content">
            <img src="/logo.svg" alt="VCogniRule" class="logo-img" />
            <h1>VCogniRule</h1>
            <p class="tagline">Rule-Based Early Mental Health Screening System</p>

            <div class="welcome-disclaimer">
                <p>This is a <strong>screening tool</strong>, not a diagnostic system.</p>
                <p>If you are in crisis, please contact your local emergency services.</p>
            </div>

            <div class="welcome-buttons">
                <a href="/screening" class="btn btn-warm">Start Screening</a>
                <a href="/about" class="btn btn-outline">About</a>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; VCogniRule 2026</p>
        </footer>
    </div>
</body>
</html>
