<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCogniRule — New Rule</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="admin-page">
        <div class="admin-header">
            <h1>Create New Rule</h1>
            <a href="/admin/dashboard" class="btn btn-outline btn-sm">← Back</a>
        </div>
        <div th:if="${formError != null}" class="form-error" role="alert" th:text="${formError}">Error</div>

        <form method="post" action="/admin/rule/new" class="admin-form">
            <div class="form-row">
                <label>Rule ID</label>
                <input type="text" name="ruleId" placeholder="e.g., CUSTOM-001" required th:value="${form?.ruleId}" />
            </div>
            <div class="form-row">
                <label>Name</label>
                <input type="text" name="name" required th:value="${form?.name}" />
            </div>
            <div class="form-row">
                <label>Level (1-4)</label>
                <select name="level">
                    <option value="1" th:selected="${form?.level == 1}">1 — Base</option>
                    <option value="2" th:selected="${form?.level == 2}">2 — Composite</option>
                    <option value="3" th:selected="${form?.level == 3}">3 — Higher-order</option>
                    <option value="4" th:selected="${form?.level == 4}">4 — Synthesis</option>
                </select>
            </div>
            <div class="form-row">
                <label>Category</label>
                <select name="category">
                    <option th:each="c : ${T(com.ooad.mhs.util.Category).values()}" th:value="${c}" th:text="${c}"
                            th:selected="${form?.category == c}">MOOD</option>
                </select>
            </div>
            <div class="form-row">
                <label>Priority (0-100)</label>
                <input type="number" name="priority" min="0" max="100" th:value="${form?.priority != null ? form.priority : 50}" />
            </div>
            <div class="form-row">
                <label>Action Type</label>
                <select name="actionType">
                    <option th:each="a : ${T(com.ooad.mhs.util.ActionType).values()}" th:value="${a}" th:text="${a}"
                            th:selected="${form?.actionType == a}">MONITOR</option>
                </select>
            </div>
            <div class="form-row">
                <label>Explanation</label>
                <textarea name="explanation" rows="3" th:text="${form?.explanation}"></textarea>
            </div>
            <div class="form-row">
                <label>Source Reference</label>
                <input type="text" name="sourceRef" th:value="${form?.sourceRef}" />
            </div>
            <div class="form-row">
                <label>Conclusion Key</label>
                <input type="text" name="conclusionKey" th:value="${form?.conclusionKey}" />
            </div>
            <div class="form-row">
                <label>Conclusion Value</label>
                <input type="text" name="conclusionValue" th:value="${form != null ? form.conclusionValue : '1'}" />
            </div>
            <button type="submit" class="btn btn-primary">Create Rule</button>
        </form>
    </div>
    <footer class="footer"><p>&copy; VCogniRule 2026</p></footer>
</body>
</html>
