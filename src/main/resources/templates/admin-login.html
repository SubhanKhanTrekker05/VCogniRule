<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCogniRule — Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="login-page">
        <h2>Admin Login</h2>
        <p class="login-subtitle">Manage screening rules and conditions</p>
        <div th:if="${error}" class="login-error" th:text="${error}"></div>
        <form class="login-form" method="post" action="/admin/login">
            <div>
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username" />
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p style="text-align:center; margin-top:1rem;">
            <a href="/" style="color:var(--text-muted); font-size:0.85rem;">← Back to Home</a>
        </p>
    </div>
</body>
</html>
